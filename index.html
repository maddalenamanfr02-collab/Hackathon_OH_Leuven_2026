<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Kiro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrap">
    <canvas id="game" width="808" height="663"></canvas>

    <div id="overlay" class="overlay">
      <div class="panel">
        <h1>Flappy Kiro</h1>
        <p class="sub">Guide the ghost through the pipes</p>
        <p class="hint">Click, tap, or press <kbd>Space</kbd> to flap</p>
        <button id="start-btn">Play</button>
      </div>
    </div>

    <div id="gameover" class="overlay hidden">
      <div class="panel">
        <h1>Game Over</h1>
        <p class="score-line">Score: <span id="final-score">0</span></p>
        <p class="score-line">Best: <span id="final-high">0</span></p>
        <button id="restart-btn">Play Again</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
